<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kirov bridge preview</title>
<style>
  html, body { margin: 0; background: #0b1013; overflow: hidden; }
  canvas { display: block; }
  #label { position: absolute; top: 10px; left: 12px; color: #fff; font: 12px monospace; text-shadow: 0 1px 2px #000; white-space: pre; }
</style>
</head>
<body>
<div id="label">KIROV BRIDGE PREVIEW</div>
<script type="module">
// Bridge preview, standalone or inside the ship. URL parameters:
//   view=game|helm|telegraph|sight|controls|chair|aft|overview|repeat|window   preset cameras
//   cam=x,y,z  target=x,y,z  (room frame)  fov=deg
//   ship=1        build the exterior too, with the bridge at BRIDGE_ANCHOR (window view check)
//   plan=slava    the Slava (Project 1164) room on slava-exterior.js's SLAVA_BRIDGE plan; with ship=1
//                 inside the Slava exterior (bridgeInterior) and weapons
//   stage=idle|designated|tracking|tracked|preparing|ready|armed|firing|complete|aborted  weapon=granit|fort|osa
//   night=0..1  conditions=day|dusk|overcast|night  sun=elevation,azimuth  exposure=  env=  speed=knots  t=seconds
import * as THREE from 'three';
import { buildBridge, EYE, LOOK, SLAVA_EYE, SLAVA_LOOK } from '../src/models/kirov-bridge.js';

const q = new URLSearchParams(location.search);
const num = (k, d) => (q.has(k) ? Number(q.get(k)) : d);
const vec = (k, d) => (q.has(k) ? q.get(k).split(',').map(Number) : d);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = num('exposure', 1.0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.append(renderer.domElement);

const scene = new THREE.Scene();
const night = num('night', q.get('conditions') === 'night' ? 1 : 0);
const sky = new THREE.Color(0xb9c4c8).lerp(new THREE.Color(0x0a0f18), night);
scene.background = sky;
scene.fog = new THREE.Fog(sky, 900, 6000);
scene.add(new THREE.HemisphereLight(0xdde8f0, 0x3c4a50, 1.0 * (1 - night * 0.92)));
const [sunEl, sunAz] = vec('sun', [24, 200]);
const sun = new THREE.DirectionalLight(0xfff1dc, 3.0 * (1 - night * 0.95));
const el = THREE.MathUtils.degToRad(sunEl), az = THREE.MathUtils.degToRad(sunAz);
sun.position.set(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)).multiplyScalar(200);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 10, far: 500 });
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide,
  vertexShader: 'varying vec3 p; void main(){ p = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: 'varying vec3 p; void main(){ float h = normalize(p).y; vec3 c = mix(vec3(.25,.3,.32), vec3(.75,.82,.88), smoothstep(-.2,.6,h)); gl_FragColor = vec4(c,1.); }',
})));
scene.environment = pmrem.fromScene(envScene).texture;
scene.environmentIntensity = num('env', 1.0) * (1 - night * 0.6);

const water = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), new THREE.MeshStandardMaterial({ color: 0x2d3f44, roughness: 0.35, metalness: 0.1 }));
water.rotation.x = -Math.PI / 2;
water.receiveShadow = true;
scene.add(water);

const t0 = performance.now();
let bridge, root = new THREE.Group(), exterior = null;
scene.add(root);
const slava = q.get('plan') === 'slava';
if (slava) {
  const Ext = await import('../src/models/slava-exterior.js');
  if (q.get('ship') === '1') {
    exterior = Ext.buildSlavaExterior({ bridgeInterior: true });
    root.add(exterior.group);
    const Wp = await import('../src/models/slava-weapons.js');
    const weapons = Wp.buildSlavaWeapons({ mounts: Ext.SLAVA_MOUNTS, deckHeightAt: Ext.slavaDeckHeightAt });
    root.add(weapons.group);
    weapons.cutouts?.apply?.(exterior.group);
  }
  bridge = buildBridge({ anchor: Ext.SLAVA_BRIDGE_ANCHOR, plan: Ext.SLAVA_BRIDGE });
} else if (q.get('ship') === '1') {
  const Ext = await import('../src/models/kirov-exterior.js');
  const anchor = Ext.BRIDGE_ANCHOR ?? { x: 0, y: 20, z: -30 };
  exterior = Ext.buildExterior();
  root.add(exterior.group);
  bridge = buildBridge({ anchor });
} else bridge = buildBridge();
root.add(bridge.group);
const buildMs = performance.now() - t0;
sun.target.position.copy(bridge.group.position);

// cameras in the room frame
const views = {
  game: [EYE.toArray(), LOOK.toArray(), 72],
  window: [[0.2, 1.7, -2.95], [0.1, 0.9, -7], 72],
  // matched to the reference photographs (refs/photos)
  controls: [[-6.3, 1.62, -3.15], [2.2, 1.2, -0.6], 56],
  helm: [[-1.45, 1.5, -2.62], [-0.55, 1.02, -3.22], 52],
  telegraph: [[-2.75, 1.62, -2.55], [-1.95, 0.98, -3.28], 52],
  sight: [[-4.32, 1.08, -3.02], [-4.86, 1.62, -3.6], 64],
  chair: [[1.8, 1.25, -4.05], [2.6, 0.95, -2.6], 62],
  outside: [[9.5, 2.4, -7.2], [1.0, 1.7, -3.6], 55],
  // inspection views
  aft: [[0.8, 1.7, -3.2], [0.4, 1.3, 2.7], 72],
  overview: [[6.9, 2.45, 2.2], [-2.0, 0.9, -3.0], 74],
  repeat: [[1.75, 1.6, -0.75], [2.55, 1.0, -1.45], 48],
  chart: [[-3.7, 1.75, 0.5], [-4.7, 0.9, 2.2], 60],
  wing: [[6.9, 1.7, -0.6], [-2.0, 1.2, -3.6], 72],
};
// the Slava room's cameras (its room frame: front at z -4.8, sides x +-7.0, aft bulkhead z 5.1)
const slavaViews = {
  game: [SLAVA_EYE.toArray(), SLAVA_LOOK.toArray(), 72],
  down: [[0.5, 1.6, -4.0], [0.45, 0.4, -9], 72],
  overview: [[6.3, 2.2, 4.6], [-2.0, 0.9, -3.5], 74],
  front: [[0.3, 1.9, 1.8], [0.0, 1.2, -5.2], 70],
  aft: [[0.6, 1.7, -3.4], [0.4, 1.3, 5.1], 72],
  port: [[3.5, 1.7, -1.0], [-6.5, 1.3, -2.6], 70],
  helm: [[-0.25, 1.45, -2.7], [-1.0, 0.98, -3.5], 52],
  repeat: [[2.25, 1.55, -0.6], [2.75, 1.0, -1.3], 48],
  outside: [[12, 1.5, -8], [0, 1.4, -2], 50],
  wing: [[8.2, 1.7, 1.2], [0, 1.2, -3.5], 60],
};
const v = (slava ? slavaViews : views)[q.get('view') || 'game'] || (slava ? slavaViews : views).game;
const camLocal = new THREE.Vector3(...vec('cam', v[0])), tgtLocal = new THREE.Vector3(...vec('target', v[1]));
const aspect = innerWidth / innerHeight;
const camera = new THREE.PerspectiveCamera(num('fov', v[2]), aspect, 0.05, 20000);
camera.position.copy(camLocal).add(bridge.group.position);
camera.lookAt(tgtLocal.clone().add(bridge.group.position));

const fc = { stage: q.get('stage') || 'idle', weapon: q.get('weapon') || 'granit', targetId: q.get('stage') ? 1 : null, salvo: 2, remaining: 1,
  progress: num('progress', 0.55), stepLabel: q.get('step') || 'CHECK LAUNCH CIRCUITS', reason: '' };
const KNOT = 0.514444;
const state = { heading: 0.35, desiredHeading: 0.52, speed: num('speed', 18) * KNOT, desiredSpeed: num('speed', 18) * KNOT, radar: true, pos: { x: 0, z: 0 },
  tracks: [{ id: 1, type: 'ship', pos: { x: 9000, z: -26000 } }, { id: 2, type: 'ship', pos: { x: -14000, z: -30000 } }, { id: 3, type: 'plane', pos: { x: 6000, z: -40000 } }, { id: 4, type: 'munition', pos: { x: -2000, z: -15000 } }],
  fireControl: fc, ammo: { fort: 94 } };
bridge.updateDisplays({ ...state, night, conditions: q.get('conditions') || (night ? 'night' : 'day') });
let time = num('t', 30);
for (let i = 0; i < 40; i++) { time += 0.05; exterior?.animate?.(time, 0.05, state); bridge.animate(time, 0.05, { ...state, time }); }
renderer.render(scene, camera);
const info = bridge.info();
document.getElementById('label').textContent = `KIROV BRIDGE · ${q.get('view') || 'game'} · build ${buildMs.toFixed(0)} ms · ${info.tris} tris · ${renderer.info.render.calls} calls`;
window.preview = { scene, camera, bridge, renderer, info: { ...info, calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, buildMs }, ready: true,
  render() { renderer.render(scene, camera); return renderer.info.render; } };
</script>
</body>
</html>
